name: Fix YD-IT time-saver placement

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-time-saver-placement.yml'

permissions:
  contents: write

jobs:
  fix-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix placement
        run: python3 fix_time_saver_placement.py

      - name: Commit corrected HTML
        run: |
          git config user.name "yd-it-service"
          git config user.email "yd-it-service@gmx.de"
          git add index.html YD-IT-aktuell.html
          git commit -m "Fix bilingual time-saver section placement" || exit 0
          git push

      - name: Upload corrected HTML
        uses: actions/upload-artifact@v4
        with:
          name: YD-IT-current-index-html-fixed
          path: YD-IT-aktuell.html
