name: Update DatenPhoenix image and package current site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-datenphoenix-and-package.yml'

permissions:
  contents: write

jobs:
  update-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current website
        uses: actions/checkout@v4

      - name: Replace DatenPhoenix partner image
        shell: bash
        run: |
          cat > /tmp/datenphoenix.b64 <<'B64'

B64
          base64 -d /tmp/datenphoenix.b64 > datenphoenix.jpg
          file datenphoenix.jpg
          rm -f .github/workflows/update-datenphoenix-and-package.yml

      - name: Commit current site image update
        shell: bash
        run: |
          git config user.name "yd-it-service"
          git config user.email "yd-it-service@gmx.de"
          git add -A
          git commit -m "Use cropped DatenPhoenix partner image"
          git push

      - name: Create downloadable ZIP of current website
        shell: bash
        run: |
          zip -r YD-IT-current-site.zip . -x '.git/*' '.github/*' 'YD-IT-current-site.zip'

      - name: Upload website ZIP
        uses: actions/upload-artifact@v4
        with:
          name: YD-IT-current-site
          path: YD-IT-current-site.zip
          if-no-files-found: error
