name: Add YD-IT time-saver section

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-time-saver-section.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch current website
        run: python3 patch_time_saver.py

      - name: Commit updated HTML
        run: |
          git config user.name "yd-it-service"
          git config user.email "yd-it-service@gmx.de"
          git add index.html YD-IT-aktuell.html
          git commit -m "Add time-saving on-site datacenter section" || exit 0
          git push

      - name: Upload HTML
        uses: actions/upload-artifact@v4
        with:
          name: YD-IT-current-index-html
          path: YD-IT-aktuell.html
