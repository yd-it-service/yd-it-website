name: Add DatenPhoenix partner

"on":
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-datenphoenix.yml'

permissions:
  contents: write

jobs:
  add-partner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          if 'src="datenphoenix.jpg"' not in html:
              de = '<p>Premium Service, Organisation und Projektunterstützung.</p>\n</div>'
              de_card = de + '\n<div class="card">\n<div class="partner-logo-wrap">\n<img alt="DatenPhoenix" class="partner-logo" src="datenphoenix.jpg"/>\n</div>\n<h3>DatenPhoenix</h3>\n<p>Partner für professionelle Datenrettung und technische Recovery-Services.</p>\n</div>'
              en = '<p>Premium service, organization and project support.</p>\n</div>'
              en_card = en + '\n<div class="card">\n<div class="partner-logo-wrap"><img alt="DatenPhoenix" class="partner-logo" src="datenphoenix.jpg"/></div>\n<h3>DatenPhoenix</h3>\n<p>Professional data recovery and technical recovery services.</p>\n</div>'
              if de not in html:
                  raise SystemExit("German partner anchor not found")
              if en not in html:
                  raise SystemExit("English partner anchor not found")
              html = html.replace(de, de_card, 1)
              html = html.replace(en, en_card, 1)
              path.write_text(html, encoding="utf-8")
          PY
          rm -f datenphoenix.png datenphoenix-partner.html
          rm -f .github/workflows/add-datenphoenix.yml

      - name: Commit
        shell: bash
        run: |
          git config user.name "yd-it-service"
          git config user.email "yd-it-service@gmx.de"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Show DatenPhoenix in partner section"
          git push
